# netlify.toml — BPNP Map 3D

# ── Build: สร้าง dataVersions และเลข build (APP_VERSION) อัตโนมัติทุกครั้งที่ deploy ──
# deploy ผ่าน Git เท่านั้น (ถ้าอัปโหลดแบบลากวาง ให้รัน node tools/build.js เองก่อน)
[build]
  command = "node tools/build.js"
  publish = "."

# เอกสารและต้นฉบับ GAS ไม่ต้องเปิดให้เข้าถึงจากเว็บ
[[redirects]]
  from = "/backend/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# ไฟล์ควบคุมเวอร์ชัน / Service Worker / config ต้องตรวจกับเซิร์ฟเวอร์ทุกครั้ง
[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/history.json"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
