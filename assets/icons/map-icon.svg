<svg id="my-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" class="w-full h-full" style="--map-green: #3fa423; --map-blue-dark: #5e95b0; --pin-blue: #0008fa; --pencil-body: #0008fa; --bldg-left: #ccced1; --bldg-right: #a0a2a5; --map-blue-light: #5e95b0;">
  <defs>
    <style>
      :root { 
        --white-border: #F2F5F6; 
        --map-grey-light: #A3A3A3; 
        --map-grey-dark: #8A8A8A; 
        --pencil-eraser: #F48A3D; 
        --pencil-wood: #E0A570; 
        --pencil-lead: #163C65; 
        --pencil-highlight: rgba(255, 255, 255, 0.35); 
        --bldg-top: #ffffff; 
        --bldg-shadow: rgba(0,0,0,0.15); 
      }
      .white-fill { fill: var(--white-border); }
      .map-outline { fill: none; stroke: var(--white-border); stroke-width: 18; stroke-linejoin: round; }
      .map-gl { fill: var(--map-green); }
      .map-grl { fill: var(--map-grey-light); }
      .map-grd { fill: var(--map-grey-dark); }
      .map-bd { fill: var(--map-blue-dark); }
      .map-bl { fill: var(--map-blue-light); }
      .pin { fill: var(--pin-blue); }
      .p-eraser { fill: var(--pencil-eraser); }
      .p-body { fill: var(--pencil-body); }
      .p-wood { fill: var(--pencil-wood); }
      .p-lead { fill: var(--pencil-lead); }
      .p-glow { fill: var(--pencil-highlight); }
      .b-shadow { fill: var(--bldg-shadow); }
      .b-left { fill: var(--bldg-left); }
      .b-right { fill: var(--bldg-right); }
      .b-top { fill: var(--bldg-top); }
    </style>
  </defs>

  <!-- Content Group -->
  <g id="zoom-group" style="transform-origin: 256px 256px;" transform="scale(1)">
    
    <g class="draggable" id="item-map" transform="translate(1.2, 0) rotate(0) scale(1.1)">
      <g transform="translate(255, 300) scale(0.95, 1.17)">
        <path class="map-outline" d="M-185,-105 L-75,-135 L75,-95 L185,-135 L185,95 L75,135 L-75,95 L-185,125 Z" />
        <path class="white-fill" d="M-185,-105 L-75,-135 L75,-95 L185,-135 L185,95 L75,135 L-75,95 L-185,125 Z" />
        <polygon class="map-gl" points="-185,-105 -75,-135 -75,95 -185,125" />
        <path class="map-grl" d="M-185,-5 Q-130,-35 -75,-5 L-75,55 Q-130,25 -185,55 Z" />
        <polygon class="map-bd" points="-75,-135 75,-95 75,135 -75,95" />
        <path class="map-grd" d="M-75,-135 L75,-95 L75,5 Q0,-25 -75,-5 Z" />
        <polygon class="map-bl" points="75,-95 185,-135 185,95 75,135" />
        <path class="map-grl" d="M75,-95 L185,-135 L185,-45 Q130,-15 75,5 Z" />
      </g>
    </g>

    <g class="draggable" id="item-bldg1" transform="translate(0, 0) rotate(0) scale(1)">
      <g transform="translate(255, 300) scale(0.95, 1.17)">
        <g transform="translate(-45, 40) scale(1.3)">
          <polygon class="b-shadow" points="0,35 30,50 70,30 40,15" />
          <polygon class="b-left" points="0,-25 30,-10 30,50 0,35" />
          <polygon class="b-right" points="30,-10 60,-25 60,35 30,50" />
          <polygon class="b-top" points="30,-40 60,-25 30,-10 0,-25" />
        </g>
      </g>
    </g>

    <g class="draggable" id="item-bldg2" transform="translate(0, 0) rotate(0) scale(1)">
      <g transform="translate(255, 300) scale(0.95, 1.17)">
        <g transform="translate(-150, -5) scale(0.9)">
          <polygon class="b-shadow" points="0,35 30,50 70,30 40,15" />
          <polygon class="b-left" points="0,-15 30,0 30,50 0,35" />
          <polygon class="b-right" points="30,0 60,-15 60,35 30,50" />
          <polygon class="b-top" points="30,-30 60,-15 30,0 0,-15" />
        </g>
      </g>
    </g>
    
    <g class="draggable" id="item-pin" transform="translate(13.5, 4.9) rotate(0) scale(1)">
      <g transform="translate(210, 270) scale(1.4, 1.3)">
        <path class="pin" d="M0,0 C-20,-35 -60,-100 -60,-130 A60,60 0 1,1 60,-130 C60,-100 20,-35 0,0 Z" />
        <circle class="white-fill" cx="0" cy="-130" r="27" />
      </g>
    </g>
    
    <g class="draggable" id="item-pencil" transform="translate(-2.5, -19.6) rotate(0) scale(1.1)">
      <g transform="translate(365, 250) scale(1.2) rotate(30)">
        <path d="M-30,-140 C-30,-160 30,-160 30,-140 L30,70 L0,135 L-30,70 Z" fill="var(--white-border)" stroke="var(--white-border)" stroke-width="1" stroke-linejoin="round" />
        <path class="p-eraser" d="M-30,-140 C-30,-155 30,-155 30,-140 L30,-95 L-30,-95 Z" />
        <rect class="white-fill" x="-30" y="-95" width="60" height="20" />
        <path class="p-body" d="M-30,-75 L30,-75 L30,65 Q15,75 0,65 Q-15,75 -30,65 Z" />
        <path class="p-wood" d="M-30,65 Q-15,75 0,65 Q15,75 30,65 L0,135 Z" />
        <path class="p-lead" d="M-13,106 Q0,116 13,106 L0,135 Z" />
        <rect class="p-glow" x="-20" y="-75" width="10" height="135" rx="5" />
      </g>
    </g>
  </g>
</svg>
