<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <style>
    .w{fill:#F2F5F6} .g{fill:#8cca7a} .gl{fill:#A3A3A3} .gd{fill:#8A8A8A}
    .b{fill:#7db5d2} .pin{fill:#d13415} .er{fill:#F48A3D} .pb{fill:#2b85c6}
    .wd{fill:#E0A570} .ld{fill:#163C65} .hl{fill:#fff;fill-opacity:.35}
    .sh{fill:#000;fill-opacity:.15} .wall{fill:#e2e8f0} .roof{fill:#fff}
  </style>

  <defs>
    <!-- อาคารเล็ก (ใช้ซ้ำ 2 จุด) -->
    <g id="bldg">
      <polygon class="sh" points="0,35 30,50 70,30 40,15" />
      <polygon class="wall" points="0,-15 30,0 60,-15 60,35 30,50 0,35" />
      <polygon class="roof" points="30,-30 60,-15 30,0 0,-15" />
    </g>
  </defs>

  <rect width="512" height="512" rx="40" fill="#cdadff" />

  <g transform="translate(7.68 7.68) scale(.97)">
    <!-- แผนที่ -->
    <g transform="translate(241.1 306.3) scale(.95 1.17)">
      <path class="w" d="M-185,-105L-75,-135 75,-95 185,-135V95L75,135-75,95-185,125Z" fill="none" stroke="#F2F5F6" stroke-width="18" stroke-linejoin="round" />
      <polygon class="g" points="-185,-105 -75,-135 -75,95 -185,125" />
      <path class="gl" d="M-185,-5Q-130,-35-75,-5V55Q-130,25-185,55Z" />
      <polygon class="b" points="-75,-135 75,-95 185,-135 185,95 75,135 -75,95" />
      <path class="gd" d="M-75,-135L75,-95V5Q0,-25-75,-5Z" />
      <path class="gl" d="M75,-95L185,-135V-45Q130,-15 75,5Z" />
    </g>

    <!-- อาคารใหญ่ -->
    <g transform="translate(195.8 310.1) scale(1.235 1.521)">
      <polygon class="sh" points="0,35 30,50 70,30 40,15" />
      <polygon class="wall" points="0,-25 30,-10 60,-25 60,35 30,50 0,35" />
      <polygon class="roof" points="30,-40 60,-25 30,-10 0,-25" />
    </g>

    <!-- อาคารเล็ก (ขวาล่าง) -->
    <use href="#bldg" transform="translate(156.8 353.6) scale(.855 1.053)" />

    <!-- หมุด -->
    <g transform="translate(230.3 272.5) scale(1.4 1.3)">
      <path class="pin" d="M0,0C-20,-35-60,-100-60,-130A60,60 0 1,1 60,-130C60,-100 20,-35 0,0Z" />
      <circle class="w" cy="-130" r="27" />
    </g>

    <!-- ดินสอ -->
    <g transform="translate(346.2 208.8) rotate(27) scale(1.35)">
      <path class="w" stroke="#F2F5F6" stroke-width="3" stroke-linejoin="round" d="M-30,-140C-30,-160 30,-160 30,-140V70L0,135-30,70Z" />
      <path class="er" d="M-30,-140C-30,-155 30,-155 30,-140V-95H-30Z" />
      <path class="pb" d="M-30,-75H30V65Q15,75 0,65-15,75-30,65Z" />
      <path class="wd" d="M-30,65Q-15,75 0,65 15,75 30,65L0,135Z" />
      <path class="ld" d="M-13,106Q0,116 13,106L0,135Z" />
      <rect class="hl" x="-20" y="-75" width="10" height="135" rx="5" />
    </g>

    <!-- อาคารเล็ก (ซ้าย) -->
    <use href="#bldg" transform="translate(111.2 296.7) scale(.855 1.053)" />
  </g>
</svg>
