<svg width="100%" height="100%" viewBox="10 5 80 80" xmlns="http://www.w3.org/2000/svg">
  <style>
    :root {
      --gray-light: #D3D7D8;
      --blue-mid: #63A6F2;
      --blue-royal: #0003F8;
    }
    .isometric-shape {
      d: path("M 46 12 Q 50 10 54 12 L 86 28 Q 90 30 86 32 L 54 48 Q 50 50 46 48 L 14 32 Q 10 30 14 28 Z");
    }
    .layer-bot {
      fill: var(--blue-royal);
    }
    .layer-mid {
      fill: var(--blue-mid);
      opacity: 0.9;
    }
    .layer-top {
      fill: var(--gray-light);
      opacity: 0.8; 
    }
  </style>

  <path class="layer-bot isometric-shape" transform="translate(0, 30)"/>
  <path class="layer-mid isometric-shape" transform="translate(0, 15)"/>
  <path class="layer-top isometric-shape" />
</svg>
